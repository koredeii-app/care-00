<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    overflow: hidden;
  }
  .card {
    width: 1200px;
    height: 630px;
    background: #e8f5e9;
    position: relative;
    display: flex;
    align-items: center;
  }
  /* 背景の六角形パターン */
  .bg {
    position: absolute;
    inset: 0;
    opacity: 0.4;
    background-image:
      linear-gradient(60deg, #8bc34a22 25%, transparent 25%),
      linear-gradient(-60deg, #8bc34a22 25%, transparent 25%);
    background-size: 80px 140px;
  }
  .left {
    width: 560px;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 70px 80px;
    position: relative;
    gap: 20px;
  }
  .tag {
    display: inline-block;
    background: #8bc34a;
    color: white;
    font-size: 18px;
    font-weight: bold;
    padding: 6px 18px;
    border-radius: 4px;
    letter-spacing: 2px;
    width: fit-content;
  }
  .title {
    font-size: 70px;
    font-weight: bold;
    color: #1b5e20;
    letter-spacing: 4px;
    line-height: 1.1;
  }
  .sub {
    font-size: 22px;
    color: #388e3c;
    letter-spacing: 2px;
  }
  .desc {
    font-size: 18px;
    color: #555;
    line-height: 1.9;
    border-left: 4px solid #8bc34a;
    padding-left: 16px;
  }
  .right {
    flex: 1;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .phone-mock {
    width: 260px;
    height: 440px;
    background: white;
    border-radius: 36px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    border: 3px solid #e0e0e0;
    padding: 32px 24px;
  }
  .mock-icon { font-size: 56px; }
  .mock-title {
    font-size: 20px;
    font-weight: bold;
    color: #333;
    text-align: center;
    letter-spacing: 1px;
  }
  .mock-btn {
    background: #8bc34a;
    color: white;
    font-size: 18px;
    font-weight: bold;
    padding: 12px 28px;
    border-radius: 999px;
    letter-spacing: 1px;
    width: 100%;
    text-align: center;
  }
  .mock-line {
    width: 80%;
    height: 12px;
    background: #f0f0f0;
    border-radius: 6px;
  }
  .mock-line.green { background: #c5e1a5; width: 60%; }
</style>
</head>
<body>
<div class="card">
  <div class="bg"></div>
  <div class="left">
    <div class="tag">無料・登録不要</div>
    <div class="title">押すだけ<br>相談</div>
    <div class="sub">地域包括支援センター検索</div>
    <div class="desc">高齢者の介護・認知症・<br>在宅生活の相談窓口を<br>地域から探してそのまま電話</div>
  </div>
  <div class="right">
    <div class="phone-mock">
      <div class="mock-icon">📋</div>
      <div class="mock-title">地域を選んで<br>そのまま電話</div>
      <div class="mock-line"></div>
      <div class="mock-line green"></div>
      <div class="mock-btn">📞 電話する</div>
    </div>
  </div>
</div>
</body>
</html>
