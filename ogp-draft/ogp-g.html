<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    overflow: hidden;
  }
  .card {
    width: 1200px;
    height: 630px;
    background: white;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
  }
  /* 上下の帯 */
  .bar-top {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 140px;
    background: #8bc34a;
  }
  .bar-bottom {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 80px;
    background: #f1f8e9;
    border-top: 3px solid #c5e1a5;
  }
  .badge {
    position: relative;
    background: white;
    border-radius: 999px;
    padding: 10px 36px;
    font-size: 18px;
    color: #558b2f;
    font-weight: bold;
    letter-spacing: 2px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    z-index: 1;
    margin-top: -20px;
  }
  .main {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .title {
    font-size: 100px;
    font-weight: bold;
    color: #1b5e20;
    letter-spacing: 8px;
    text-align: center;
  }
  .subtitle {
    font-size: 26px;
    color: #555;
    letter-spacing: 3px;
  }
  .footer-text {
    position: absolute;
    bottom: 24px;
    font-size: 17px;
    color: #888;
    letter-spacing: 2px;
    z-index: 1;
  }
  .icon-row {
    position: relative;
    z-index: 1;
    display: flex;
    gap: 20px;
  }
  .icon-box {
    background: #f1f8e9;
    border: 2px solid #c5e1a5;
    border-radius: 16px;
    padding: 16px 24px;
    text-align: center;
    font-size: 15px;
    color: #388e3c;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .icon-box .em { font-size: 28px; }
</style>
</head>
<body>
<div class="card">
  <div class="bar-top"></div>
  <div class="bar-bottom"></div>
  <div class="badge">📞 地域包括支援センター検索</div>
  <div class="main">
    <div class="title">押すだけ相談</div>
    <div class="subtitle">高齢者・介護の相談窓口をすぐ見つける</div>
  </div>
  <div class="icon-row">
    <div class="icon-box">
      <div class="em">🗾</div>
      <div>地域から探す</div>
    </div>
    <div class="icon-box">
      <div class="em">💬</div>
      <div>状況で絞り込む</div>
    </div>
    <div class="icon-box">
      <div class="em">📞</div>
      <div>そのまま電話</div>
    </div>
  </div>
  <div class="footer-text">無料・登録不要・個人開発</div>
</div>
</body>
</html>
