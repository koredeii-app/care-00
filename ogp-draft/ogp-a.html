<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    background: #f1f8e9;
    font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .card {
    width: 1200px;
    height: 630px;
    background: linear-gradient(135deg, #8bc34a 0%, #558b2f 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    position: relative;
  }
  .circle {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
  }
  .c1 { width: 400px; height: 400px; top: -120px; right: -80px; }
  .c2 { width: 250px; height: 250px; bottom: -60px; left: -40px; }
  .icon {
    font-size: 80px;
    line-height: 1;
  }
  .title {
    font-size: 72px;
    font-weight: bold;
    color: white;
    letter-spacing: 4px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }
  .subtitle {
    font-size: 28px;
    color: rgba(255,255,255,0.9);
    letter-spacing: 2px;
  }
  .badge {
    margin-top: 8px;
    background: white;
    color: #558b2f;
    font-size: 20px;
    font-weight: bold;
    padding: 8px 28px;
    border-radius: 999px;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="circle c1"></div>
  <div class="circle c2"></div>
  <div class="icon">📞</div>
  <div class="title">押すだけ相談</div>
  <div class="subtitle">地域包括支援センター検索</div>
  <div class="badge">お近くのセンターをすぐ見つける</div>
</div>
</body>
</html>
